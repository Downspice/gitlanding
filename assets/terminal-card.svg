<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 160" width="100%" height="100%">
  <defs>
    <linearGradient id="termBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0e0e12"/>
      <stop offset="100%" stop-color="#050508"/>
    </linearGradient>

    <linearGradient id="linkBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#16161f"/>
      <stop offset="100%" stop-color="#0d0d12"/>
    </linearGradient>
  </defs>

  <style>
    .font-sans { font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'SF Pro Display', 'Segoe UI', Roboto, sans-serif; }
    .font-mono { font-family: 'JetBrains Mono', 'SFMono-Regular', Menlo, Monaco, Consolas, monospace; }

    @keyframes blink {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }

    .term-cursor {
      animation: blink 1s step-end infinite;
    }
  </style>

  <rect width="920" height="160" rx="14" fill="url(#termBg)" stroke="#1c1c22" stroke-width="1"/>

  <!-- Command Line Prompt -->
  <g transform="translate(28, 38)">
    <text x="0" y="0" font-size="13" font-weight="600" fill="#71717A" class="font-mono">$</text>
    <text x="18" y="0" font-size="13.5" font-weight="600" fill="#EDEDED" class="font-mono">npx downspice --connect</text>
    <rect x="235" y="-13" width="7" height="17" fill="#3b82f6" class="term-cursor"/>
  </g>

  <!-- Output message -->
  <g transform="translate(28, 70)">
    <text x="0" y="0" font-size="13" font-weight="400" fill="#8E8E93" class="font-sans">
      Interested in collaborating, hiring, or discussing technical architecture? Let's connect.
    </text>
  </g>

  <!-- Action Links (Framer Button Style) -->
  <g transform="translate(28, 96)">
    <!-- GitHub Link -->
    <g transform="translate(0, 0)">
      <rect width="150" height="38" rx="8" fill="url(#linkBg)" stroke="#272733" stroke-width="1"/>
      <text x="20" y="24" font-size="12" font-weight="600" fill="#EDEDED" class="font-mono">GitHub Profile</text>
      <text x="132" y="23" font-size="11" fill="#71717A" class="font-mono">↗</text>
    </g>

    <!-- Email Link -->
    <g transform="translate(162, 0)">
      <rect width="130" height="38" rx="8" fill="url(#linkBg)" stroke="#272733" stroke-width="1"/>
      <text x="20" y="24" font-size="12" font-weight="600" fill="#EDEDED" class="font-mono">Email Direct</text>
      <text x="112" y="23" font-size="11" fill="#71717A" class="font-mono">↗</text>
    </g>

    <!-- Web Landing Link -->
    <g transform="translate(304, 0)">
      <rect width="150" height="38" rx="8" fill="url(#linkBg)" stroke="#272733" stroke-width="1"/>
      <text x="20" y="24" font-size="12" font-weight="600" fill="#EDEDED" class="font-mono">downspice.io</text>
      <text x="132" y="23" font-size="11" fill="#71717A" class="font-mono">↗</text>
    </g>

    <text x="860" y="24" font-size="11" font-weight="500" fill="#52525B" text-anchor="end" class="font-mono">
      Type-Safe Systems • 2026
    </text>
  </g>
</svg>