<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 160" width="100%" height="100%">
  <defs>
    <linearGradient id="termBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#090909"/>
      <stop offset="100%" stop-color="#010101"/>
    </linearGradient>

    <linearGradient id="btnBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#121212"/>
      <stop offset="100%" stop-color="#050505"/>
    </linearGradient>
  </defs>

  <style>
    .font-sans { font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'SF Pro Display', 'Segoe UI', Roboto, sans-serif; }
    .font-mono { font-family: 'JetBrains Mono', 'SFMono-Regular', Menlo, Monaco, Consolas, monospace; }

    @keyframes blink {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }

    .term-cursor {
      animation: blink 1s step-end infinite;
    }
  </style>

  <rect width="920" height="160" rx="4" fill="url(#termBg)" stroke="#1b1b1b" stroke-width="1"/>

  <!-- Command Line Prompt -->
  <g transform="translate(28, 38)">
    <text x="0" y="0" font-size="13" font-weight="700" fill="#c3fc2f" class="font-mono">$</text>
    <text x="18" y="0" font-size="13.5" font-weight="600" fill="#f8f5ee" class="font-mono">npx downspice --connect</text>
    <rect x="235" y="-13" width="7" height="17" fill="#fdd506" class="term-cursor"/>
  </g>

  <!-- Output message -->
  <g transform="translate(28, 70)">
    <text x="0" y="0" font-size="13" font-weight="400" fill="#d0cec7" class="font-sans">
      Interested in collaborating, hiring, or discussing systems architecture? Let's build together.
    </text>
  </g>

  <!-- Action Links (Portfolio Style) -->
  <g transform="translate(28, 96)">
    <!-- GitHub Link -->
    <g transform="translate(0, 0)">
      <rect width="145" height="38" rx="2" fill="url(#btnBg)" stroke="#1b1b1b" stroke-width="1"/>
      <text x="18" y="24" font-size="12" font-weight="700" fill="#f8f5ee" class="font-mono">GitHub Profile</text>
      <text x="127" y="23" font-size="11" font-weight="700" fill="#fdd506" class="font-mono">↗</text>
    </g>

    <!-- Email Link -->
    <g transform="translate(157, 0)">
      <rect width="130" height="38" rx="2" fill="url(#btnBg)" stroke="#1b1b1b" stroke-width="1"/>
      <text x="18" y="24" font-size="12" font-weight="700" fill="#f8f5ee" class="font-mono">Email Direct</text>
      <text x="112" y="23" font-size="11" font-weight="700" fill="#fdd506" class="font-mono">↗</text>
    </g>

    <!-- Portfolio Link -->
    <g transform="translate(299, 0)">
      <rect width="180" height="38" rx="2" fill="url(#btnBg)" stroke="#fdd506" stroke-opacity="0.4" stroke-width="1"/>
      <text x="18" y="24" font-size="12" font-weight="700" fill="#fdd506" class="font-mono">Portfolio Site</text>
      <text x="162" y="23" font-size="11" font-weight="700" fill="#c3fc2f" class="font-mono">↗</text>
    </g>

    <text x="860" y="24" font-size="11" font-weight="600" fill="#74716b" text-anchor="end" class="font-mono">
      JOSEPH AWER • 2026
    </text>
  </g>
</svg>