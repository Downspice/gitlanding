<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 180" width="100%" height="100%">
  <defs>
    <linearGradient id="metricCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#0a0f1d"/>
    </linearGradient>

    <linearGradient id="barTs" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3178c6"/>
      <stop offset="100%" stop-color="#60a5fa"/>
    </linearGradient>

    <linearGradient id="barRepos" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f5d4"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
  </defs>

  <style>
    .font-sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    .font-mono { font-family: 'SFMono-Regular', Consolas, Menlo, monospace; }

    @keyframes barFill {
      0% { width: 0; }
      100% { width: 140px; }
    }

    @keyframes statPulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.03); }
    }

    .num-pulse {
      animation: statPulse 3s ease-in-out infinite;
      transform-origin: center;
    }
  </style>

  <rect width="900" height="180" rx="16" fill="#090d16" stroke="#1e293b" stroke-width="1.2"/>

  <!-- Card 1: 37 Public Repos -->
  <g transform="translate(25, 20)">
    <rect width="195" height="140" rx="12" fill="url(#metricCard)" stroke="#00f5d4" stroke-opacity="0.3" stroke-width="1"/>
    <text x="20" y="32" font-size="11" font-weight="700" fill="#00f5d4" class="font-mono">REPOSITORIES</text>
    <text x="20" y="74" font-size="34" font-weight="900" fill="#f8fafc" class="font-mono num-pulse">37</text>
    <text x="20" y="98" font-size="11" fill="#94a3b8" class="font-sans">Public codebases on GitHub</text>
    <rect x="20" y="115" width="155" height="6" rx="3" fill="#1e293b"/>
    <rect x="20" y="115" width="135" height="6" rx="3" fill="url(#barRepos)"/>
  </g>

  <!-- Card 2: 85%+ TypeScript -->
  <g transform="translate(240, 20)">
    <rect width="195" height="140" rx="12" fill="url(#metricCard)" stroke="#3178c6" stroke-opacity="0.4" stroke-width="1"/>
    <text x="20" y="32" font-size="11" font-weight="700" fill="#60a5fa" class="font-mono">TYPE SAFETY</text>
    <text x="20" y="74" font-size="34" font-weight="900" fill="#60a5fa" class="font-mono num-pulse">85%+</text>
    <text x="20" y="98" font-size="11" fill="#94a3b8" class="font-sans">28+ Repos in TypeScript</text>
    <rect x="20" y="115" width="155" height="6" rx="3" fill="#1e293b"/>
    <rect x="20" y="115" width="140" height="6" rx="3" fill="url(#barTs)"/>
  </g>

  <!-- Card 3: Enterprise & HR Systems -->
  <g transform="translate(455, 20)">
    <rect width="195" height="140" rx="12" fill="url(#metricCard)" stroke="#bf5af2" stroke-opacity="0.3" stroke-width="1"/>
    <text x="20" y="32" font-size="11" font-weight="700" fill="#bf5af2" class="font-mono">DOMAIN FOCUS</text>
    <text x="20" y="66" font-size="20" font-weight="800" fill="#f8fafc" class="font-sans">Enterprise</text>
    <text x="20" y="86" font-size="13" font-weight="600" fill="#a855f7" class="font-sans">&amp; Ticketing Platforms</text>
    <text x="20" y="115" font-size="11" fill="#94a3b8" class="font-sans">Modular microservices</text>
  </g>

  <!-- Card 4: Open Source Since 2020 -->
  <g transform="translate(670, 20)">
    <rect width="195" height="140" rx="12" fill="url(#metricCard)" stroke="#30d158" stroke-opacity="0.3" stroke-width="1"/>
    <text x="20" y="32" font-size="11" font-weight="700" fill="#30d158" class="font-mono">CONTRIBUTIONS</text>
    <text x="20" y="74" font-size="34" font-weight="900" fill="#f8fafc" class="font-mono num-pulse">2020</text>
    <text x="20" y="98" font-size="11" fill="#94a3b8" class="font-sans">Active GitHub Developer</text>
    <g transform="translate(20, 115)">
      <circle cx="5" cy="5" r="4" fill="#30d158"/>
      <text x="14" y="9" font-size="11" font-weight="600" fill="#4ade80" class="font-sans">Continuously shipping</text>
    </g>
  </g>
</svg>