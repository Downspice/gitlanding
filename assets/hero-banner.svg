<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 340" width="100%" height="100%">
  <defs>
    <!-- Base Canvas Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#080808"/>
      <stop offset="100%" stop-color="#010101"/>
    </linearGradient>

    <!-- Top Ambient Gold/Lime Diffuse Glow (Matching Portfolio) -->
    <radialGradient id="topAmbientGlow" cx="50%" cy="0%" r="70%">
      <stop offset="0%" stop-color="#fdd506" stop-opacity="0.16"/>
      <stop offset="35%" stop-color="#c3fc2f" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <!-- Hairline Highlights -->
    <linearGradient id="topEdgeGold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fdd506" stop-opacity="0.05"/>
      <stop offset="50%" stop-color="#fdd506" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#c3fc2f" stop-opacity="0.05"/>
    </linearGradient>

    <linearGradient id="metricCardBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0a0a0a"/>
      <stop offset="100%" stop-color="#030303"/>
    </linearGradient>

    <!-- Portfolio Signature Dual-Tone: Gold to Lime -->
    <linearGradient id="goldLime" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fdd506"/>
      <stop offset="100%" stop-color="#c3fc2f"/>
    </linearGradient>

    <linearGradient id="textGold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f8f5ee"/>
      <stop offset="60%" stop-color="#fdd506"/>
      <stop offset="100%" stop-color="#c3fc2f"/>
    </linearGradient>
  </defs>

  <style>
    .font-sans { font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'SF Pro Display', 'Segoe UI', Roboto, sans-serif; }
    .font-mono { font-family: 'JetBrains Mono', 'SFMono-Regular', Menlo, Monaco, Consolas, monospace; }

    @keyframes ambientBreath {
      0%, 100% { opacity: 0.16; }
      50% { opacity: 0.26; }
    }

    .ambient-glow {
      animation: ambientBreath 5s ease-in-out infinite;
    }

    @keyframes liveBeacon {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.35; transform: scale(0.9); }
    }

    .live-dot {
      animation: liveBeacon 2s ease-in-out infinite;
      transform-origin: center;
    }

    @keyframes sweepGauge {
      0% { stroke-dashoffset: 220; }
      100% { stroke-dashoffset: 45; }
    }

    .gauge-circle {
      stroke-dasharray: 220;
      animation: sweepGauge 2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
  </style>

  <!-- Canvas Surface -->
  <rect width="920" height="340" rx="4" fill="url(#bgGrad)"/>

  <!-- Top Ambient Warm Gold Glow -->
  <rect width="920" height="340" rx="4" fill="url(#topAmbientGlow)" class="ambient-glow"/>

  <!-- Precision Technical Grid (1px Hairline) -->
  <g stroke="#f8f5ee" stroke-opacity="0.02" stroke-width="1">
    <line x1="0" y1="64" x2="920" y2="64"/>
    <line x1="0" y1="210" x2="920" y2="210"/>
    <line x1="280" y1="0" x2="280" y2="340"/>
    <line x1="620" y1="0" x2="620" y2="340"/>
  </g>

  <!-- Outer Border -->
  <rect x="0.5" y="0.5" width="919" height="339" rx="3.5" fill="none" stroke="#1b1b1b" stroke-width="1"/>
  <!-- Gold Top Highlight Line -->
  <line x1="20" y1="1" x2="900" y2="1" stroke="url(#topEdgeGold)" stroke-width="1.2"/>

  <!-- TOP HEADER ROW -->
  <g transform="translate(36, 26)">
    <text x="0" y="15.5" font-size="11" font-weight="800" fill="#fdd506" class="font-mono" letter-spacing="0.12em">
      JOSEPH KWEKU AWER
    </text>

    <!-- Handle & Year -->
    <text x="848" y="15.5" font-size="11" font-weight="600" fill="#74716b" class="font-mono" text-anchor="end" letter-spacing="0.06em">
      @Downspice • FULL-STACK &amp; MOBILE
    </text>
  </g>

  <!-- HERO STATEMENT -->
  <g transform="translate(36, 116)">
    <text x="0" y="0" font-size="34" font-weight="800" fill="#f8f5ee" class="font-sans" letter-spacing="-0.03em">
      Fast by default. <tspan fill="#fdd506">Typed by design.</tspan>
    </text>
    <text x="0" y="32" font-size="14.5" font-weight="400" fill="#d0cec7" class="font-sans" letter-spacing="-0.01em">
      Building performant mobile &amp; web systems with Expo, Next.js, and Python.
    </text>
  </g>

  <!-- METRIC & PERFORMANCE TILES (BOTTOM ROW) -->
  <g transform="translate(36, 215)">
    <!-- Tile 1: Type Safety Ratio (Gauge Style) -->
    <g transform="translate(0, 0)">
      <rect width="265" height="95" rx="2" fill="url(#metricCardBg)" stroke="#1b1b1b" stroke-width="1"/>
      <line x1="0" y1="0" x2="265" y2="0" stroke="url(#topEdgeGold)" stroke-width="0.8"/>
      
      <!-- Circular Gauge in Gold/Lime -->
      <g transform="translate(42, 48)">
        <circle cx="0" cy="0" r="28" fill="none" stroke="#121212" stroke-width="4.5"/>
        <circle cx="0" cy="0" r="28" fill="none" stroke="url(#goldLime)" stroke-width="4.5" stroke-linecap="round" class="gauge-circle" transform="rotate(-90)"/>
        <text x="0" y="5" font-size="13" font-weight="800" fill="#fdd506" text-anchor="middle" class="font-mono">85%</text>
      </g>

      <g transform="translate(86, 36)">
        <text x="0" y="0" font-size="10" font-weight="700" fill="#74716b" class="font-mono" letter-spacing="0.1em">CORE ECOSYSTEM</text>
        <text x="0" y="18" font-size="14" font-weight="700" fill="#f8f5ee" class="font-sans">TypeScript First</text>
        <text x="0" y="35" font-size="11" font-weight="600" fill="#c3fc2f" class="font-mono">28+ Repositories</text>
      </g>
    </g>

    <!-- Tile 2: Total Production Repos -->
    <g transform="translate(290, 0)">
      <rect width="265" height="95" rx="2" fill="url(#metricCardBg)" stroke="#1b1b1b" stroke-width="1"/>
      <line x1="0" y1="0" x2="265" y2="0" stroke="url(#topEdgeGold)" stroke-width="0.8"/>

      <g transform="translate(20, 36)">
        <text x="0" y="0" font-size="10" font-weight="700" fill="#74716b" class="font-mono" letter-spacing="0.1em">SYSTEMS SHIPPED</text>
        <g transform="translate(0, 22)">
          <text x="0" y="0" font-size="30" font-weight="900" fill="#f8f5ee" class="font-mono" letter-spacing="-0.03em">37</text>
          <text x="48" y="-3" font-size="12" font-weight="600" fill="#d0cec7" class="font-sans">Repositories</text>
        </g>
        <text x="0" y="38" font-size="11" fill="#74716b" class="font-mono">Full-Stack &amp; Mobile</text>
      </g>

      <!-- Sparkline in Gold -->
      <g transform="translate(180, 48)">
        <path d="M 0 20 L 15 14 L 30 18 L 45 8 L 60 2" fill="none" stroke="#fdd506" stroke-width="2" stroke-linecap="round"/>
        <circle cx="60" cy="2" r="3" fill="#c3fc2f"/>
      </g>
    </g>

    <!-- Tile 3: Location & Reach -->
    <g transform="translate(580, 0)">
      <rect width="265" height="95" rx="2" fill="url(#metricCardBg)" stroke="#1b1b1b" stroke-width="1"/>
      <line x1="0" y1="0" x2="265" y2="0" stroke="url(#topEdgeGold)" stroke-width="0.8"/>

      <g transform="translate(20, 36)">
        <text x="0" y="0" font-size="10" font-weight="700" fill="#74716b" class="font-mono" letter-spacing="0.1em">LOCATION &amp; ROOTS</text>
        <g transform="translate(0, 22)">
          <text x="0" y="0" font-size="21" font-weight="800" fill="#f8f5ee" class="font-sans" letter-spacing="-0.02em">Accra, Ghana</text>
        </g>
        <text x="0" y="38" font-size="11" fill="#c3fc2f" class="font-mono">Ghana → Worldwide 🌍</text>
      </g>

      <g transform="translate(195, 30)">
        <rect width="50" height="22" rx="2" fill="#090909" stroke="#c3fc2f" stroke-opacity="0.4" stroke-width="1"/>
        <text x="25" y="15" font-size="9" font-weight="800" fill="#c3fc2f" text-anchor="middle" class="font-mono">ONLINE</text>
      </g>
    </g>
  </g>
</svg>