<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" width="100%" height="100%">
  <defs>
    <!-- Dark Glass Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0d14"/>
      <stop offset="50%" stop-color="#0f1422"/>
      <stop offset="100%" stop-color="#080b11"/>
    </linearGradient>

    <!-- Animated Aurora Gradients -->
    <radialGradient id="auroraCyan" cx="20%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#00f5d4" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#00f5d4" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="auroraPurple" cx="80%" cy="70%" r="60%">
      <stop offset="0%" stop-color="#7928ca" stop-opacity="0.4"/>
      <stop offset="60%" stop-color="#7928ca" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="auroraBlue" cx="50%" cy="10%" r="50%">
      <stop offset="0%" stop-color="#0070f3" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <!-- Text Linear Gradients -->
    <linearGradient id="nameGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="45%" stop-color="#64d2ff"/>
      <stop offset="85%" stop-color="#bf5af2"/>
      <stop offset="100%" stop-color="#ff375f"/>
    </linearGradient>

    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1f293d"/>
      <stop offset="100%" stop-color="#131b2e"/>
    </linearGradient>

    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#64d2ff" stop-opacity="0.7"/>
      <stop offset="50%" stop-color="#bf5af2" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#30d158" stop-opacity="0.6"/>
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="softGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <style>
    .font-sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    .font-mono { font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, Courier, monospace; }

    /* Animated Aurora Movement */
    @keyframes moveAurora1 {
      0% { transform: translate(0px, 0px) scale(1); }
      50% { transform: translate(40px, -20px) scale(1.15); }
      100% { transform: translate(-20px, 30px) scale(0.95); }
    }

    @keyframes moveAurora2 {
      0% { transform: translate(0px, 0px) scale(1); }
      50% { transform: translate(-50px, 25px) scale(1.1); }
      100% { transform: translate(30px, -20px) scale(0.9); }
    }

    .aurora-1 { animation: moveAurora1 14s ease-in-out infinite alternate; transform-origin: center; }
    .aurora-2 { animation: moveAurora2 18s ease-in-out infinite alternate; transform-origin: center; }

    /* Pulsing Green Status Beacon */
    @keyframes beaconPulse {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.8); opacity: 0; }
    }

    @keyframes beaconCenter {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.6; }
    }

    .beacon-ring {
      animation: beaconPulse 2s cubic-bezier(0, 0, 0.2, 1) infinite;
      transform-origin: 52px 48px;
    }

    .beacon-dot {
      animation: beaconCenter 2s ease-in-out infinite;
    }

    /* Floating Tech Badges */
    @keyframes floatUp {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-7px); }
    }

    @keyframes floatDown {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(7px); }
    }

    .float-1 { animation: floatUp 4.5s ease-in-out infinite; }
    .float-2 { animation: floatDown 5.2s ease-in-out infinite; }
    .float-3 { animation: floatUp 6s ease-in-out infinite; }
    .float-4 { animation: floatDown 4.8s ease-in-out infinite; }

    /* Blinking Terminal Cursor */
    @keyframes cursorBlink {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }

    .cursor { animation: cursorBlink 1s step-end infinite; }

    /* Shimmering Border */
    @keyframes borderPulse {
      0%, 100% { stroke-opacity: 0.4; }
      50% { stroke-opacity: 0.85; }
    }

    .card-border {
      animation: borderPulse 4s ease-in-out infinite;
    }
  </style>

  <!-- Container Box -->
  <rect width="900" height="320" rx="20" fill="url(#bgGrad)"/>

  <!-- Animated Aurora Lights -->
  <g>
    <circle cx="180" cy="90" r="240" fill="url(#auroraCyan)" class="aurora-1"/>
    <circle cx="750" cy="220" r="260" fill="url(#auroraPurple)" class="aurora-2"/>
    <circle cx="480" cy="50" r="200" fill="url(#auroraBlue)" class="aurora-1"/>
  </g>

  <!-- Background Cyber Grid overlay -->
  <g stroke="#ffffff" stroke-opacity="0.03" stroke-width="1">
    <line x1="0" y1="80" x2="900" y2="80"/>
    <line x1="0" y1="160" x2="900" y2="160"/>
    <line x1="0" y1="240" x2="900" y2="240"/>
    <line x1="180" y1="0" x2="180" y2="320"/>
    <line x1="360" y1="0" x2="360" y2="320"/>
    <line x1="540" y1="0" x2="540" y2="320"/>
    <line x1="720" y1="0" x2="720" y2="320"/>
  </g>

  <!-- Glowing Border Outline -->
  <rect x="1" y="1" width="898" height="318" rx="19" fill="none" stroke="url(#borderGrad)" stroke-width="1.5" class="card-border"/>

  <!-- Status Badge (Top-Left) -->
  <g transform="translate(40, 34)">
    <rect width="280" height="28" rx="14" fill="#0d1b1e" stroke="#00f5d4" stroke-opacity="0.3" stroke-width="1"/>
    <!-- Animated Beacon -->
    <circle cx="16" cy="14" r="7" fill="#00f5d4" opacity="0.4" class="beacon-ring"/>
    <circle cx="16" cy="14" r="4" fill="#00f5d4" class="beacon-dot"/>
    <text x="32" y="18" fill="#00f5d4" font-size="11.5" font-weight="700" class="font-mono" letter-spacing="0.5">AVAILABLE FOR NEW PROJECTS</text>
  </g>

  <!-- Tag / Handle (Top-Right) -->
  <g transform="translate(735, 34)">
    <rect width="125" height="28" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1"/>
    <text x="62.5" y="18" fill="#8b949e" font-size="12" font-weight="600" class="font-mono" text-anchor="middle">@Downspice</text>
  </g>

  <!-- Main Hero Title -->
  <text x="40" y="125" font-size="44" font-weight="900" fill="url(#nameGrad)" class="font-sans" letter-spacing="-1">
    Joseph Awer
  </text>

  <!-- Role Subtitle with Icons -->
  <g transform="translate(40, 160)">
    <text x="0" y="0" font-size="20" font-weight="600" fill="#e2e8f0" class="font-sans">
      Full-Stack TypeScript Engineer
    </text>
    <text x="295" y="-1" font-size="18" fill="#64d2ff">•</text>
    <text x="315" y="0" font-size="18" font-weight="500" fill="#94a3b8" class="font-sans">
      System Architect
    </text>
  </g>

  <!-- Animated Interactive Terminal Prompt Line -->
  <g transform="translate(40, 195)">
    <rect width="520" height="42" rx="10" fill="#0b0f19" stroke="#1e293b" stroke-width="1.2"/>
    <text x="16" y="26" font-size="14" font-weight="600" fill="#00f5d4" class="font-mono">&gt;</text>
    <text x="35" y="26" font-size="13.5" font-weight="500" fill="#f8fafc" class="font-mono">
      specializing in scalable web architectures &amp; type safety
    </text>
    <rect x="495" y="13" width="7" height="17" fill="#00f5d4" class="cursor"/>
  </g>

  <!-- Quick Highlight Metrics (Bottom-Left) -->
  <g transform="translate(40, 265)">
    <g transform="translate(0, 0)">
      <text x="0" y="18" font-size="22" font-weight="800" fill="#64d2ff" class="font-mono">37+</text>
      <text x="50" y="16" font-size="12" font-weight="600" fill="#64748b" class="font-sans">REPOSITORIES</text>
    </g>

    <line x1="145" y1="2" x2="145" y2="24" stroke="#1e293b" stroke-width="1.5"/>

    <g transform="translate(160, 0)">
      <text x="0" y="18" font-size="22" font-weight="800" fill="#bf5af2" class="font-mono">85%</text>
      <text x="50" y="16" font-size="12" font-weight="600" fill="#64748b" class="font-sans">TYPESCRIPT</text>
    </g>

    <line x1="295" y1="2" x2="295" y2="24" stroke="#1e293b" stroke-width="1.5"/>

    <g transform="translate(310, 0)">
      <text x="0" y="18" font-size="22" font-weight="800" fill="#30d158" class="font-mono">2020</text>
      <text x="60" y="16" font-size="12" font-weight="600" fill="#64748b" class="font-sans">OPEN SOURCE</text>
    </g>
  </g>

  <!-- Floating Tech Stack Badges (Right Area) -->
  <g transform="translate(620, 105)">
    <!-- Badge 1: TypeScript (Featured) -->
    <g class="float-1" transform="translate(60, 0)">
      <rect width="160" height="42" rx="12" fill="#0d1b2a" stroke="#3178c6" stroke-width="1.5" filter="url(#softGlow)"/>
      <rect x="10" y="9" width="24" height="24" rx="6" fill="#3178c6"/>
      <text x="22" y="26" font-size="14" font-weight="900" fill="#ffffff" text-anchor="middle" class="font-mono">TS</text>
      <text x="44" y="26" font-size="13" font-weight="700" fill="#ffffff" class="font-sans">TypeScript</text>
    </g>

    <!-- Badge 2: React -->
    <g class="float-2" transform="translate(0, 52)">
      <rect width="135" height="38" rx="10" fill="#0f172a" stroke="#00d8ff" stroke-opacity="0.6" stroke-width="1.2"/>
      <circle cx="22" cy="19" r="9" fill="#00d8ff" fill-opacity="0.2" stroke="#00d8ff" stroke-width="1.5"/>
      <text x="39" y="24" font-size="12.5" font-weight="700" fill="#e2e8f0" class="font-sans">React.js</text>
    </g>

    <!-- Badge 3: Node.js -->
    <g class="float-3" transform="translate(145, 52)">
      <rect width="125" height="38" rx="10" fill="#0f1c15" stroke="#339933" stroke-opacity="0.6" stroke-width="1.2"/>
      <circle cx="20" cy="19" r="8" fill="#339933"/>
      <text x="36" y="24" font-size="12.5" font-weight="700" fill="#e2e8f0" class="font-sans">Node.js</text>
    </g>

    <!-- Badge 4: PostgreSQL & Docker -->
    <g class="float-4" transform="translate(45, 102)">
      <rect width="170" height="38" rx="10" fill="#131b2e" stroke="#336791" stroke-opacity="0.5" stroke-width="1.2"/>
      <circle cx="20" cy="19" r="8" fill="#336791"/>
      <text x="36" y="24" font-size="12" font-weight="600" fill="#94a3b8" class="font-sans">Postgres • Docker</text>
    </g>
  </g>
</svg>