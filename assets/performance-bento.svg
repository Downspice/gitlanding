<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 420" width="100%" height="100%">
  <defs>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#090909"/>
      <stop offset="100%" stop-color="#020202"/>
    </linearGradient>

    <linearGradient id="cardTopGold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fdd506" stop-opacity="0.05"/>
      <stop offset="50%" stop-color="#fdd506" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#c3fc2f" stop-opacity="0.05"/>
    </linearGradient>
  </defs>

  <style>
    .font-sans { font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'SF Pro Display', 'Segoe UI', Roboto, sans-serif; }
    .font-mono { font-family: 'JetBrains Mono', 'SFMono-Regular', Menlo, Monaco, Consolas, monospace; }

    @keyframes liveBeacon {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.35; }
    }

    .pulse-dot {
      animation: liveBeacon 2s ease-in-out infinite;
    }
  </style>

  <!-- BASE CONTAINER -->
  <rect width="920" height="420" rx="4" fill="#010101" stroke="#1b1b1b" stroke-width="1"/>

  <!-- PANEL 1: awer-ticketing (520px) -->
  <g transform="translate(20, 20)">
    <rect width="520" height="230" rx="2" fill="url(#cardGrad)" stroke="#1b1b1b" stroke-width="1"/>
    <line x1="0" y1="0" x2="520" y2="0" stroke="url(#cardTopGold)" stroke-width="1"/>

    <g transform="translate(24, 28)">
      <text x="0" y="0" font-size="10.5" font-weight="700" fill="#fdd506" class="font-mono" letter-spacing="0.1em">01 / EVENT ARCHITECTURE</text>
      <text x="0" y="28" font-size="20" font-weight="800" fill="#f8f5ee" class="font-sans">awer-ticketing</text>
      <text x="0" y="52" font-size="13" font-weight="400" fill="#d0cec7" class="font-sans">
        High-throughput event and customer support ticketing platform.
      </text>
      <text x="0" y="70" font-size="13" font-weight="400" fill="#74716b" class="font-sans">
        Engineered with deterministic state machines and strict type boundaries.
      </text>
    </g>

    <!-- State flow pipeline -->
    <g transform="translate(24, 138)">
      <rect width="95" height="38" rx="2" fill="#090909" stroke="#1b1b1b" stroke-width="1"/>
      <text x="47.5" y="23" font-size="11" font-weight="600" fill="#f8f5ee" text-anchor="middle" class="font-mono">Ingest</text>

      <path d="M 103 19 L 122 19" stroke="#fdd506" stroke-width="1.5" stroke-dasharray="2 2"/>

      <rect x="130" y="0" width="95" height="38" rx="2" fill="#090909" stroke="#1b1b1b" stroke-width="1"/>
      <text x="177.5" y="23" font-size="11" font-weight="600" fill="#f8f5ee" text-anchor="middle" class="font-mono">Process</text>

      <path d="M 233 19 L 252 19" stroke="#fdd506" stroke-width="1.5" stroke-dasharray="2 2"/>

      <rect x="260" y="0" width="95" height="38" rx="2" fill="#090909" stroke="#1b1b1b" stroke-width="1"/>
      <text x="307.5" y="23" font-size="11" font-weight="600" fill="#f8f5ee" text-anchor="middle" class="font-mono">Route</text>

      <path d="M 363 19 L 382 19" stroke="#c3fc2f" stroke-width="1.5"/>

      <rect x="390" y="0" width="75" height="38" rx="2" fill="#090909" stroke="#c3fc2f" stroke-opacity="0.6" stroke-width="1"/>
      <text x="427.5" y="23" font-size="11" font-weight="700" fill="#c3fc2f" text-anchor="middle" class="font-mono">Resolve</text>
    </g>

    <g transform="translate(24, 204)">
      <circle cx="4" cy="4" r="3" fill="#c3fc2f" class="pulse-dot"/>
      <text x="14" y="7" font-size="10.5" font-weight="700" fill="#c3fc2f" class="font-mono">LIFECYCLE ENGINE</text>
      <text x="468" y="7" font-size="11" fill="#74716b" text-anchor="end" class="font-mono">TypeScript • Node.js • REST</text>
    </g>
  </g>

  <!-- PANEL 2: awer-hr-backend (340px) -->
  <g transform="translate(560, 20)">
    <rect width="340" height="230" rx="2" fill="url(#cardGrad)" stroke="#1b1b1b" stroke-width="1"/>
    <line x1="0" y1="0" x2="340" y2="0" stroke="url(#cardTopGold)" stroke-width="1"/>

    <g transform="translate(24, 28)">
      <text x="0" y="0" font-size="10.5" font-weight="700" fill="#fdd506" class="font-mono" letter-spacing="0.1em">02 / ENTERPRISE CORE</text>
      <text x="0" y="28" font-size="19" font-weight="800" fill="#f8f5ee" class="font-sans">awer-hr-backend</text>
      <text x="0" y="52" font-size="12.5" font-weight="400" fill="#d0cec7" class="font-sans">
        Modular employee directory and lifecycle service.
      </text>
    </g>

    <!-- Checklist -->
    <g transform="translate(24, 115)">
      <g transform="translate(0, 0)">
        <text x="0" y="0" font-size="11" font-weight="800" fill="#fdd506" class="font-mono">ACID</text>
        <text x="45" y="0" font-size="12" fill="#f8f5ee" class="font-sans">Transactional DB Integrity</text>
      </g>
      <g transform="translate(0, 26)">
        <text x="0" y="0" font-size="11" font-weight="800" fill="#c3fc2f" class="font-mono">RBAC</text>
        <text x="45" y="0" font-size="12" fill="#f8f5ee" class="font-sans">Fine-Grained Permissions</text>
      </g>
      <g transform="translate(0, 52)">
        <text x="0" y="0" font-size="11" font-weight="800" fill="#fdd506" class="font-mono">AUTH</text>
        <text x="45" y="0" font-size="12" fill="#f8f5ee" class="font-sans">JWT &amp; Secure Session Flow</text>
      </g>
    </g>

    <g transform="translate(24, 204)">
      <text x="0" y="7" font-size="11" fill="#74716b" class="font-mono">Node.js • PostgreSQL • Prisma</text>
    </g>
  </g>

  <!-- PANEL 3: ug-alumnisphere (430px) -->
  <g transform="translate(20, 270)">
    <rect width="430" height="130" rx="2" fill="url(#cardGrad)" stroke="#1b1b1b" stroke-width="1"/>
    <line x1="0" y1="0" x2="430" y2="0" stroke="url(#cardTopGold)" stroke-width="1"/>

    <g transform="translate(24, 26)">
      <text x="0" y="0" font-size="10.5" font-weight="700" fill="#c3fc2f" class="font-mono" letter-spacing="0.1em">03 / SOCIAL PLATFORM</text>
      <text x="0" y="24" font-size="16" font-weight="800" fill="#f8f5ee" class="font-sans">ug-alumnisphere</text>
      <text x="0" y="46" font-size="12" font-weight="400" fill="#d0cec7" class="font-sans">
        Alumni network connecting university graduates with career mentoring.
      </text>
      <text x="0" y="76" font-size="11" font-weight="600" fill="#74716b" class="font-mono">
        TypeScript • React • Microservices
      </text>
    </g>
  </g>

  <!-- PANEL 4: alphaworld (430px) -->
  <g transform="translate(470, 270)">
    <rect width="430" height="130" rx="2" fill="url(#cardGrad)" stroke="#1b1b1b" stroke-width="1"/>
    <line x1="0" y1="0" x2="430" y2="0" stroke="url(#cardTopGold)" stroke-width="1"/>

    <g transform="translate(24, 26)">
      <text x="0" y="0" font-size="10.5" font-weight="700" fill="#fdd506" class="font-mono" letter-spacing="0.1em">04 / ACCESSIBILITY &amp; IMPACT</text>
      <text x="0" y="24" font-size="16" font-weight="800" fill="#f8f5ee" class="font-sans">alphaworld</text>
      <text x="0" y="46" font-size="12" font-weight="400" fill="#d0cec7" class="font-sans">
        Assisting dyslexic children learn alphabets with specialized UI principles.
      </text>
      <text x="0" y="76" font-size="11" font-weight="600" fill="#74716b" class="font-mono">
        C# • Accessible UI Design
      </text>
    </g>
  </g>
</svg>