<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 80" width="100%" height="80">
  <defs>
    <linearGradient id="connectBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>

    <linearGradient id="btnGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <filter id="badgeGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <style>
    .font-sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    .font-mono { font-family: 'SFMono-Regular', Consolas, Menlo, monospace; }

    @keyframes badgeFloat {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-2px); }
    }

    .badge-item { animation: badgeFloat 4s ease-in-out infinite; }
    .badge-2 { animation-delay: 0.8s; }
    .badge-3 { animation-delay: 1.6s; }
    .badge-4 { animation-delay: 2.4s; }
  </style>

  <rect width="900" height="80" rx="14" fill="url(#connectBg)" stroke="#1e293b" stroke-width="1.2"/>

  <!-- Left: Get In Touch -->
  <g transform="translate(30, 26)">
    <circle cx="14" cy="14" r="14" fill="#00f5d4" fill-opacity="0.15"/>
    <text x="14" y="19" font-size="14" text-anchor="middle">💬</text>
    <text x="40" y="12" font-size="13" font-weight="700" fill="#f8fafc" class="font-sans">LET'S CONNECT &amp; BUILD</text>
    <text x="40" y="27" font-size="11" fill="#64748b" class="font-sans">Open for full-stack engineering &amp; collaborations</text>
  </g>

  <!-- Right: Badges -->
  <g transform="translate(430, 20)">
    <!-- GitHub Badge -->
    <g class="badge-item badge-1" transform="translate(0, 0)">
      <rect width="130" height="40" rx="10" fill="url(#btnGrad)" stroke="#64d2ff" stroke-opacity="0.4" stroke-width="1"/>
      <text x="14" y="24" font-size="15">🐙</text>
      <text x="36" y="24" font-size="12" font-weight="700" fill="#64d2ff" class="font-mono">GitHub</text>
      <text x="115" y="24" font-size="11" fill="#64748b" class="font-mono">↗</text>
    </g>

    <!-- Email Badge -->
    <g class="badge-item badge-2" transform="translate(145, 0)">
      <rect width="130" height="40" rx="10" fill="url(#btnGrad)" stroke="#38bdf8" stroke-opacity="0.3" stroke-width="1"/>
      <text x="14" y="24" font-size="15">✉️</text>
      <text x="36" y="24" font-size="12" font-weight="700" fill="#e2e8f0" class="font-mono">Email</text>
      <text x="115" y="24" font-size="11" fill="#64748b" class="font-mono">↗</text>
    </g>

    <!-- Portfolio / Web Badge -->
    <g class="badge-item badge-3" transform="translate(290, 0)">
      <rect width="150" height="40" rx="10" fill="url(#btnGrad)" stroke="#00f5d4" stroke-opacity="0.4" stroke-width="1"/>
      <text x="14" y="24" font-size="15">🌐</text>
      <text x="36" y="24" font-size="12" font-weight="700" fill="#00f5d4" class="font-mono">Web Landing</text>
      <text x="135" y="24" font-size="11" fill="#64748b" class="font-mono">↗</text>
    </g>
  </g>
</svg>