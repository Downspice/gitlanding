<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 290" width="100%" height="100%">
  <defs>
    <linearGradient id="cardGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#101726"/>
      <stop offset="100%" stop-color="#0a0f1d"/>
    </linearGradient>

    <linearGradient id="cardGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141923"/>
      <stop offset="100%" stop-color="#0a0d14"/>
    </linearGradient>

    <filter id="cardShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <style>
    .font-sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    .font-mono { font-family: 'SFMono-Regular', Consolas, Menlo, monospace; }

    @keyframes cardFloat {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-3px); }
    }

    .bento-1 { animation: cardFloat 5s ease-in-out infinite; }
    .bento-2 { animation: cardFloat 6s ease-in-out infinite 0.7s; }
    .bento-3 { animation: cardFloat 5.6s ease-in-out infinite 1.2s; }
    .bento-4 { animation: cardFloat 5.2s ease-in-out infinite 1.8s; }

    @keyframes liveBeacon {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.85); }
    }

    .pulse-dot {
      animation: liveBeacon 2s infinite ease-in-out;
      transform-origin: center;
    }
  </style>

  <!-- BACKGROUND -->
  <rect width="900" height="290" rx="16" fill="#090d16" stroke="#1e293b" stroke-width="1.2"/>

  <!-- CARD 1: awer-ticketing (TOP LEFT) -->
  <g class="bento-1" transform="translate(20, 20)">
    <rect width="420" height="115" rx="12" fill="url(#cardGrad1)" stroke="#3178c6" stroke-opacity="0.4" stroke-width="1.2" filter="url(#cardShadow)"/>
    <g transform="translate(18, 20)">
      <!-- Icon + Title -->
      <text x="0" y="14" font-size="16">🎫</text>
      <text x="26" y="14" font-size="15" font-weight="700" fill="#64d2ff" class="font-mono">awer-ticketing</text>
      <rect x="300" y="-3" width="75" height="20" rx="6" fill="#00f5d4" fill-opacity="0.12" stroke="#00f5d4" stroke-opacity="0.4"/>
      <circle cx="310" cy="7" r="3" fill="#00f5d4" class="pulse-dot"/>
      <text x="318" y="11" font-size="9.5" font-weight="700" fill="#00f5d4" class="font-mono">ACTIVE</text>

      <!-- Description -->
      <text x="0" y="42" font-size="11.5" fill="#94a3b8" class="font-sans">
        Scalable event and customer support ticketing platform built
      </text>
      <text x="0" y="58" font-size="11.5" fill="#94a3b8" class="font-sans">
        with end-to-end type safety and modular status management.
      </text>

      <!-- Meta Footer -->
      <g transform="translate(0, 78)">
        <circle cx="5" cy="5" r="4" fill="#3178c6"/>
        <text x="14" y="9" font-size="11" font-weight="600" fill="#cbd5e1" class="font-sans">TypeScript</text>
        <text x="100" y="9" font-size="11" fill="#64748b" class="font-sans">• Full-Stack Platform</text>
      </g>
    </g>
  </g>

  <!-- CARD 2: awer-hr-backend (TOP RIGHT) -->
  <g class="bento-2" transform="translate(460, 20)">
    <rect width="420" height="115" rx="12" fill="url(#cardGrad2)" stroke="#bf5af2" stroke-opacity="0.3" stroke-width="1.2" filter="url(#cardShadow)"/>
    <g transform="translate(18, 20)">
      <!-- Icon + Title -->
      <text x="0" y="14" font-size="16">👥</text>
      <text x="26" y="14" font-size="15" font-weight="700" fill="#e2e8f0" class="font-mono">awer-hr-backend</text>
      <rect x="295" y="-3" width="80" height="20" rx="6" fill="#bf5af2" fill-opacity="0.12" stroke="#bf5af2" stroke-opacity="0.4"/>
      <text x="335" y="11" font-size="9.5" font-weight="700" fill="#bf5af2" text-anchor="middle" class="font-mono">ENTERPRISE</text>

      <!-- Description -->
      <text x="0" y="42" font-size="11.5" fill="#94a3b8" class="font-sans">
        HRMS backend service managing employee lifecycles, role-based
      </text>
      <text x="0" y="58" font-size="11.5" fill="#94a3b8" class="font-sans">
        access control (RBAC), authentication, and payroll integrations.
      </text>

      <!-- Meta Footer -->
      <g transform="translate(0, 78)">
        <circle cx="5" cy="5" r="4" fill="#3178c6"/>
        <text x="14" y="9" font-size="11" font-weight="600" fill="#cbd5e1" class="font-sans">TypeScript</text>
        <text x="100" y="9" font-size="11" fill="#64748b" class="font-sans">• Node.js / REST APIs</text>
      </g>
    </g>
  </g>

  <!-- CARD 3: ug-alumnisphere (BOTTOM LEFT) -->
  <g class="bento-3" transform="translate(20, 150)">
    <rect width="420" height="115" rx="12" fill="url(#cardGrad2)" stroke="#00d8ff" stroke-opacity="0.3" stroke-width="1.2" filter="url(#cardShadow)"/>
    <g transform="translate(18, 20)">
      <!-- Icon + Title -->
      <text x="0" y="14" font-size="16">🎓</text>
      <text x="26" y="14" font-size="15" font-weight="700" fill="#e2e8f0" class="font-mono">ug-alumnisphere</text>
      <rect x="300" y="-3" width="75" height="20" rx="6" fill="#00d8ff" fill-opacity="0.12" stroke="#00d8ff" stroke-opacity="0.4"/>
      <text x="337" y="11" font-size="9.5" font-weight="700" fill="#00d8ff" text-anchor="middle" class="font-mono">COMMUNITY</text>

      <!-- Description -->
      <text x="0" y="42" font-size="11.5" fill="#94a3b8" class="font-sans">
        University alumni network and directory platform connecting
      </text>
      <text x="0" y="58" font-size="11.5" fill="#94a3b8" class="font-sans">
        graduates with career mentoring, peer discovery, and events.
      </text>

      <!-- Meta Footer -->
      <g transform="translate(0, 78)">
        <circle cx="5" cy="5" r="4" fill="#3178c6"/>
        <text x="14" y="9" font-size="11" font-weight="600" fill="#cbd5e1" class="font-sans">TypeScript</text>
        <text x="100" y="9" font-size="11" fill="#64748b" class="font-sans">• React &amp; Microservices</text>
      </g>
    </g>
  </g>

  <!-- CARD 4: alphaworld (BOTTOM RIGHT) -->
  <g class="bento-4" transform="translate(460, 150)">
    <rect width="420" height="115" rx="12" fill="url(#cardGrad1)" stroke="#30d158" stroke-opacity="0.3" stroke-width="1.2" filter="url(#cardShadow)"/>
    <g transform="translate(18, 20)">
      <!-- Icon + Title -->
      <text x="0" y="14" font-size="16">🎮</text>
      <text x="26" y="14" font-size="15" font-weight="700" fill="#e2e8f0" class="font-mono">alphaworld</text>
      <rect x="290" y="-3" width="85" height="20" rx="6" fill="#30d158" fill-opacity="0.12" stroke="#30d158" stroke-opacity="0.4"/>
      <text x="332" y="11" font-size="9.5" font-weight="700" fill="#30d158" text-anchor="middle" class="font-mono">ACCESSIBILITY</text>

      <!-- Description -->
      <text x="0" y="42" font-size="11.5" fill="#94a3b8" class="font-sans">
        Interactive learning game assisting dyslexic children in adapting
      </text>
      <text x="0" y="58" font-size="11.5" fill="#94a3b8" class="font-sans">
        to alphabet recognition using specialized UI design principles.
      </text>

      <!-- Meta Footer -->
      <g transform="translate(0, 78)">
        <circle cx="5" cy="5" r="4" fill="#178600"/>
        <text x="14" y="9" font-size="11" font-weight="600" fill="#cbd5e1" class="font-sans">C#</text>
        <text x="50" y="9" font-size="11" fill="#64748b" class="font-sans">• Game UI / Social Impact</text>
      </g>
    </g>
  </g>
</svg>