<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 180" width="100%" height="100%">
  <defs>
    <linearGradient id="stackBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0e0e12"/>
      <stop offset="100%" stop-color="#060608"/>
    </linearGradient>

    <linearGradient id="pillGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#181822"/>
      <stop offset="100%" stop-color="#101016"/>
    </linearGradient>
  </defs>

  <style>
    .font-sans { font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'SF Pro Display', 'Segoe UI', Roboto, sans-serif; }
    .font-mono { font-family: 'JetBrains Mono', 'SFMono-Regular', Menlo, Monaco, Consolas, monospace; }
  </style>

  <rect width="920" height="180" rx="14" fill="url(#stackBg)" stroke="#1c1c22" stroke-width="1"/>

  <!-- Row 1: Languages & Runtime -->
  <g transform="translate(24, 28)">
    <text x="0" y="16" font-size="10" font-weight="600" fill="#71717A" class="font-mono" letter-spacing="0.1em">RUNTIME &amp; LANGUAGES</text>
    
    <g transform="translate(200, 0)">
      <!-- TypeScript (Featured) -->
      <rect width="130" height="26" rx="6" fill="#141c2c" stroke="#2563eb" stroke-opacity="0.5" stroke-width="1"/>
      <circle cx="10" cy="13" r="3" fill="#3b82f6"/>
      <text x="20" y="17" font-size="11" font-weight="600" fill="#EDEDED" class="font-mono">TypeScript 85%+</text>

      <!-- JavaScript -->
      <rect x="140" width="95" height="26" rx="6" fill="url(#pillGrad)" stroke="#22222a" stroke-width="1"/>
      <text x="187.5" y="17" font-size="11" font-weight="500" fill="#A1A1AA" text-anchor="middle" class="font-mono">JavaScript</text>

      <!-- Node.js -->
      <rect x="245" width="85" height="26" rx="6" fill="url(#pillGrad)" stroke="#22222a" stroke-width="1"/>
      <text x="287.5" y="17" font-size="11" font-weight="500" fill="#A1A1AA" text-anchor="middle" class="font-mono">Node.js</text>

      <!-- C# & C++ -->
      <rect x="340" width="90" height="26" rx="6" fill="url(#pillGrad)" stroke="#22222a" stroke-width="1"/>
      <text x="385" y="17" font-size="11" font-weight="500" fill="#A1A1AA" text-anchor="middle" class="font-mono">C# / C++</text>

      <!-- SQL -->
      <rect x="440" width="70" height="26" rx="6" fill="url(#pillGrad)" stroke="#22222a" stroke-width="1"/>
      <text x="475" y="17" font-size="11" font-weight="500" fill="#A1A1AA" text-anchor="middle" class="font-mono">SQL</text>
    </g>
  </g>

  <!-- Divider -->
  <line x1="24" y1="74" x2="896" y2="74" stroke="#181820" stroke-width="1"/>

  <!-- Row 2: Client & Architecture -->
  <g transform="translate(24, 94)">
    <text x="0" y="16" font-size="10" font-weight="600" fill="#71717A" class="font-mono" letter-spacing="0.1em">CLIENT ARCHITECTURE</text>
    
    <g transform="translate(200, 0)">
      <rect width="90" height="26" rx="6" fill="url(#pillGrad)" stroke="#22222a" stroke-width="1"/>
      <text x="45" y="17" font-size="11" font-weight="500" fill="#A1A1AA" text-anchor="middle" class="font-mono">React.js</text>

      <rect x="100" width="90" height="26" rx="6" fill="url(#pillGrad)" stroke="#22222a" stroke-width="1"/>
      <text x="145" y="17" font-size="11" font-weight="500" fill="#A1A1AA" text-anchor="middle" class="font-mono">Next.js</text>

      <rect x="200" width="115" height="26" rx="6" fill="url(#pillGrad)" stroke="#22222a" stroke-width="1"/>
      <text x="257.5" y="17" font-size="11" font-weight="500" fill="#A1A1AA" text-anchor="middle" class="font-mono">Tailwind CSS</text>

      <rect x="325" width="85" height="26" rx="6" fill="url(#pillGrad)" stroke="#22222a" stroke-width="1"/>
      <text x="367.5" y="17" font-size="11" font-weight="500" fill="#A1A1AA" text-anchor="middle" class="font-mono">Zustand</text>

      <rect x="420" width="90" height="26" rx="6" fill="url(#pillGrad)" stroke="#22222a" stroke-width="1"/>
      <text x="465" y="17" font-size="11" font-weight="500" fill="#A1A1AA" text-anchor="middle" class="font-mono">Vite / SPA</text>
    </g>
  </g>

  <!-- Divider -->
  <line x1="24" y1="134" x2="896" y2="134" stroke="#181820" stroke-width="1"/>

  <!-- Row 3: Systems & Data -->
  <g transform="translate(24, 146)">
    <text x="0" y="14" font-size="10" font-weight="600" fill="#71717A" class="font-mono" letter-spacing="0.1em">PERSISTENCE &amp; OPS</text>
    
    <g transform="translate(200, -2)">
      <rect width="110" height="26" rx="6" fill="url(#pillGrad)" stroke="#22222a" stroke-width="1"/>
      <text x="55" y="17" font-size="11" font-weight="500" fill="#A1A1AA" text-anchor="middle" class="font-mono">PostgreSQL</text>

      <rect x="120" width="105" height="26" rx="6" fill="url(#pillGrad)" stroke="#22222a" stroke-width="1"/>
      <text x="172.5" y="17" font-size="11" font-weight="500" fill="#A1A1AA" text-anchor="middle" class="font-mono">Prisma ORM</text>

      <rect x="235" width="80" height="26" rx="6" fill="url(#pillGrad)" stroke="#22222a" stroke-width="1"/>
      <text x="275" y="17" font-size="11" font-weight="500" fill="#A1A1AA" text-anchor="middle" class="font-mono">Docker</text>

      <rect x="325" width="125" height="26" rx="6" fill="url(#pillGrad)" stroke="#22222a" stroke-width="1"/>
      <text x="387.5" y="17" font-size="11" font-weight="500" fill="#A1A1AA" text-anchor="middle" class="font-mono">GitHub Actions</text>

      <rect x="460" width="95" height="26" rx="6" fill="url(#pillGrad)" stroke="#22222a" stroke-width="1"/>
      <text x="507.5" y="17" font-size="11" font-weight="500" fill="#A1A1AA" text-anchor="middle" class="font-mono">Microservices</text>
    </g>
  </g>
</svg>