<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 180" width="100%" height="100%">
  <defs>
    <linearGradient id="stackBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0a0a0a"/>
      <stop offset="100%" stop-color="#010101"/>
    </linearGradient>

    <linearGradient id="pillGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0c0c0c"/>
      <stop offset="100%" stop-color="#050505"/>
    </linearGradient>
  </defs>

  <style>
    .font-sans { font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'SF Pro Display', 'Segoe UI', Roboto, sans-serif; }
    .font-mono { font-family: 'JetBrains Mono', 'SFMono-Regular', Menlo, Monaco, Consolas, monospace; }
  </style>

  <rect width="920" height="180" rx="4" fill="url(#stackBg)" stroke="#1b1b1b" stroke-width="1"/>

  <!-- Row 1: Languages & Runtime -->
  <g transform="translate(24, 28)">
    <text x="0" y="16" font-size="10" font-weight="700" fill="#fdd506" class="font-mono" letter-spacing="0.1em">RUNTIME &amp; LANGUAGES</text>
    
    <g transform="translate(200, 0)">
      <!-- TypeScript (Featured) -->
      <rect width="130" height="26" rx="2" fill="#0e0e08" stroke="#fdd506" stroke-opacity="0.8" stroke-width="1"/>
      <circle cx="10" cy="13" r="3" fill="#fdd506"/>
      <text x="20" y="17" font-size="11" font-weight="700" fill="#f8f5ee" class="font-mono">TypeScript 85%+</text>

      <!-- Python -->
      <rect x="140" width="75" height="26" rx="2" fill="url(#pillGrad)" stroke="#1b1b1b" stroke-width="1"/>
      <text x="177.5" y="17" font-size="11" font-weight="500" fill="#d0cec7" text-anchor="middle" class="font-mono">Python</text>

      <!-- JavaScript -->
      <rect x="225" width="95" height="26" rx="2" fill="url(#pillGrad)" stroke="#1b1b1b" stroke-width="1"/>
      <text x="272.5" y="17" font-size="11" font-weight="500" fill="#d0cec7" text-anchor="middle" class="font-mono">JavaScript</text>

      <!-- Node.js -->
      <rect x="330" width="80" height="26" rx="2" fill="url(#pillGrad)" stroke="#1b1b1b" stroke-width="1"/>
      <text x="370" y="17" font-size="11" font-weight="500" fill="#d0cec7" text-anchor="middle" class="font-mono">Node.js</text>

      <!-- C# & C++ -->
      <rect x="420" width="85" height="26" rx="2" fill="url(#pillGrad)" stroke="#1b1b1b" stroke-width="1"/>
      <text x="462.5" y="17" font-size="11" font-weight="500" fill="#d0cec7" text-anchor="middle" class="font-mono">C# / C++</text>
    </g>
  </g>

  <!-- Divider -->
  <line x1="24" y1="74" x2="896" y2="74" stroke="#141414" stroke-width="1"/>

  <!-- Row 2: Client & Mobile -->
  <g transform="translate(24, 94)">
    <text x="0" y="16" font-size="10" font-weight="700" fill="#c3fc2f" class="font-mono" letter-spacing="0.1em">MOBILE &amp; FRONTEND</text>
    
    <g transform="translate(200, 0)">
      <!-- Expo / Mobile -->
      <rect width="90" height="26" rx="2" fill="#080e04" stroke="#c3fc2f" stroke-opacity="0.8" stroke-width="1"/>
      <circle cx="10" cy="13" r="3" fill="#c3fc2f"/>
      <text x="20" y="17" font-size="11" font-weight="700" fill="#f8f5ee" class="font-mono">Expo (RN)</text>

      <rect x="100" width="80" height="26" rx="2" fill="url(#pillGrad)" stroke="#1b1b1b" stroke-width="1"/>
      <text x="140" y="17" font-size="11" font-weight="500" fill="#d0cec7" text-anchor="middle" class="font-mono">Next.js</text>

      <rect x="190" width="75" height="26" rx="2" fill="url(#pillGrad)" stroke="#1b1b1b" stroke-width="1"/>
      <text x="227.5" y="17" font-size="11" font-weight="500" fill="#d0cec7" text-anchor="middle" class="font-mono">React</text>

      <rect x="275" width="115" height="26" rx="2" fill="url(#pillGrad)" stroke="#1b1b1b" stroke-width="1"/>
      <text x="332.5" y="17" font-size="11" font-weight="500" fill="#d0cec7" text-anchor="middle" class="font-mono">Tailwind CSS</text>

      <rect x="400" width="85" height="26" rx="2" fill="url(#pillGrad)" stroke="#1b1b1b" stroke-width="1"/>
      <text x="442.5" y="17" font-size="11" font-weight="500" fill="#d0cec7" text-anchor="middle" class="font-mono">Zustand</text>
    </g>
  </g>

  <!-- Divider -->
  <line x1="24" y1="134" x2="896" y2="134" stroke="#141414" stroke-width="1"/>

  <!-- Row 3: Systems & Data -->
  <g transform="translate(24, 146)">
    <text x="0" y="14" font-size="10" font-weight="700" fill="#74716b" class="font-mono" letter-spacing="0.1em">PERSISTENCE &amp; OPS</text>
    
    <g transform="translate(200, -2)">
      <rect width="105" height="26" rx="2" fill="url(#pillGrad)" stroke="#1b1b1b" stroke-width="1"/>
      <text x="52.5" y="17" font-size="11" font-weight="500" fill="#d0cec7" text-anchor="middle" class="font-mono">PostgreSQL</text>

      <rect x="115" width="100" height="26" rx="2" fill="url(#pillGrad)" stroke="#1b1b1b" stroke-width="1"/>
      <text x="165" y="17" font-size="11" font-weight="500" fill="#d0cec7" text-anchor="middle" class="font-mono">Prisma ORM</text>

      <rect x="225" width="75" height="26" rx="2" fill="url(#pillGrad)" stroke="#1b1b1b" stroke-width="1"/>
      <text x="262.5" y="17" font-size="11" font-weight="500" fill="#d0cec7" text-anchor="middle" class="font-mono">Docker</text>

      <rect x="310" width="125" height="26" rx="2" fill="url(#pillGrad)" stroke="#1b1b1b" stroke-width="1"/>
      <text x="372.5" y="17" font-size="11" font-weight="500" fill="#d0cec7" text-anchor="middle" class="font-mono">GitHub Actions</text>

      <rect x="445" width="95" height="26" rx="2" fill="url(#pillGrad)" stroke="#1b1b1b" stroke-width="1"/>
      <text x="492.5" y="17" font-size="11" font-weight="500" fill="#d0cec7" text-anchor="middle" class="font-mono">REST &amp; CI/CD</text>
    </g>
  </g>
</svg>