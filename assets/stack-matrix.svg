<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 180" width="100%" height="100%">
  <defs>
    <linearGradient id="stackBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0a0a0a"/>
      <stop offset="100%" stop-color="#010101"/>
    </linearGradient>

    <linearGradient id="pillGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0c0c0c"/>
      <stop offset="100%" stop-color="#050505"/>
    </linearGradient>
  </defs>

  <style>
    .font-sans { font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'SF Pro Display', 'Segoe UI', Roboto, sans-serif; }
    .font-mono { font-family: 'JetBrains Mono', 'SFMono-Regular', Menlo, Monaco, Consolas, monospace; }
  </style>

  <rect width="920" height="180" rx="4" fill="url(#stackBg)" stroke="#1b1b1b" stroke-width="1"/>

  <!-- Row 1: Languages & Runtime -->
  <g transform="translate(24, 28)">
    <text x="0" y="16" font-size="10" font-weight="700" fill="#fdd506" class="font-mono" letter-spacing="0.1em">RUNTIME &amp; LANGUAGES</text>
    
    <g transform="translate(195, 0)">
      <!-- TypeScript (Featured) -->
      <rect width="125" height="26" rx="2" fill="#0e0e08" stroke="#fdd506" stroke-opacity="0.8" stroke-width="1"/>
      <circle cx="10" cy="13" r="3" fill="#fdd506"/>
      <text x="20" y="17" font-size="11" font-weight="700" fill="#f8f5ee" class="font-mono">TypeScript 85%+</text>

      <!-- Python -->
      <rect x="135" width="65" height="26" rx="2" fill="url(#pillGrad)" stroke="#1b1b1b" stroke-width="1"/>
      <text x="167.5" y="17" font-size="11" font-weight="500" fill="#d0cec7" text-anchor="middle" class="font-mono">Python</text>

      <!-- JavaScript -->
      <rect x="210" width="80" height="26" rx="2" fill="url(#pillGrad)" stroke="#1b1b1b" stroke-width="1"/>
      <text x="250" y="17" font-size="11" font-weight="500" fill="#d0cec7" text-anchor="middle" class="font-mono">JavaScript</text>

      <!-- Node.js -->
      <rect x="300" width="70" height="26" rx="2" fill="url(#pillGrad)" stroke="#1b1b1b" stroke-width="1"/>
      <text x="335" y="17" font-size="11" font-weight="500" fill="#d0cec7" text-anchor="middle" class="font-mono">Node.js</text>

      <!-- Dart -->
      <rect x="380" width="55" height="26" rx="2" fill="url(#pillGrad)" stroke="#1b1b1b" stroke-width="1"/>
      <text x="407.5" y="17" font-size="11" font-weight="500" fill="#d0cec7" text-anchor="middle" class="font-mono">Dart</text>

      <!-- Java & C# -->
      <rect x="445" width="80" height="26" rx="2" fill="url(#pillGrad)" stroke="#1b1b1b" stroke-width="1"/>
      <text x="485" y="17" font-size="11" font-weight="500" fill="#d0cec7" text-anchor="middle" class="font-mono">Java / C#</text>
    </g>
  </g>

  <!-- Divider -->
  <line x1="24" y1="74" x2="896" y2="74" stroke="#141414" stroke-width="1"/>

  <!-- Row 2: Client & Mobile -->
  <g transform="translate(24, 94)">
    <text x="0" y="16" font-size="10" font-weight="700" fill="#c3fc2f" class="font-mono" letter-spacing="0.1em">MOBILE &amp; FRONTEND</text>
    
    <g transform="translate(195, 0)">
      <!-- Expo / Mobile -->
      <rect width="90" height="26" rx="2" fill="#080e04" stroke="#c3fc2f" stroke-opacity="0.8" stroke-width="1"/>
      <circle cx="10" cy="13" r="3" fill="#c3fc2f"/>
      <text x="20" y="17" font-size="11" font-weight="700" fill="#f8f5ee" class="font-mono">Expo (RN)</text>

      <rect x="100" width="65" height="26" rx="2" fill="url(#pillGrad)" stroke="#1b1b1b" stroke-width="1"/>
      <text x="132.5" y="17" font-size="11" font-weight="500" fill="#d0cec7" text-anchor="middle" class="font-mono">Flutter</text>

      <rect x="175" width="70" height="26" rx="2" fill="url(#pillGrad)" stroke="#1b1b1b" stroke-width="1"/>
      <text x="210" y="17" font-size="11" font-weight="500" fill="#d0cec7" text-anchor="middle" class="font-mono">Next.js</text>

      <rect x="255" width="65" height="26" rx="2" fill="url(#pillGrad)" stroke="#1b1b1b" stroke-width="1"/>
      <text x="287.5" y="17" font-size="11" font-weight="500" fill="#d0cec7" text-anchor="middle" class="font-mono">React</text>

      <rect x="330" width="95" height="26" rx="2" fill="url(#pillGrad)" stroke="#1b1b1b" stroke-width="1"/>
      <text x="377.5" y="17" font-size="11" font-weight="500" fill="#d0cec7" text-anchor="middle" class="font-mono">Tailwind CSS</text>

      <rect x="435" width="75" height="26" rx="2" fill="url(#pillGrad)" stroke="#1b1b1b" stroke-width="1"/>
      <text x="472.5" y="17" font-size="11" font-weight="500" fill="#d0cec7" text-anchor="middle" class="font-mono">shadcn/ui</text>
    </g>
  </g>

  <!-- Divider -->
  <line x1="24" y1="134" x2="896" y2="134" stroke="#141414" stroke-width="1"/>

  <!-- Row 3: Systems & Data -->
  <g transform="translate(24, 146)">
    <text x="0" y="14" font-size="10" font-weight="700" fill="#74716b" class="font-mono" letter-spacing="0.1em">PERSISTENCE &amp; OPS</text>
    
    <g transform="translate(195, -2)">
      <rect width="90" height="26" rx="2" fill="url(#pillGrad)" stroke="#1b1b1b" stroke-width="1"/>
      <text x="45" y="17" font-size="11" font-weight="500" fill="#d0cec7" text-anchor="middle" class="font-mono">PostgreSQL</text>

      <rect x="100" width="65" height="26" rx="2" fill="url(#pillGrad)" stroke="#1b1b1b" stroke-width="1"/>
      <text x="132.5" y="17" font-size="11" font-weight="500" fill="#d0cec7" text-anchor="middle" class="font-mono">NestJS</text>

      <rect x="175" width="85" height="26" rx="2" fill="url(#pillGrad)" stroke="#1b1b1b" stroke-width="1"/>
      <text x="217.5" y="17" font-size="11" font-weight="500" fill="#d0cec7" text-anchor="middle" class="font-mono">Prisma ORM</text>

      <rect x="270" width="65" height="26" rx="2" fill="url(#pillGrad)" stroke="#1b1b1b" stroke-width="1"/>
      <text x="302.5" y="17" font-size="11" font-weight="500" fill="#d0cec7" text-anchor="middle" class="font-mono">Docker</text>

      <rect x="345" width="80" height="26" rx="2" fill="url(#pillGrad)" stroke="#1b1b1b" stroke-width="1"/>
      <text x="385" y="17" font-size="11" font-weight="500" fill="#d0cec7" text-anchor="middle" class="font-mono">Paystack</text>

      <rect x="435" width="105" height="26" rx="2" fill="url(#pillGrad)" stroke="#1b1b1b" stroke-width="1"/>
      <text x="487.5" y="17" font-size="11" font-weight="500" fill="#d0cec7" text-anchor="middle" class="font-mono">GitHub Actions</text>
    </g>
  </g>
</svg>
