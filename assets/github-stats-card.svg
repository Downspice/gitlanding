<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 495 195" width="495" height="195">
  <defs>
    <!-- Background Gradient Matching Portfolio & Streak Card -->
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#080808"/>
      <stop offset="100%" stop-color="#010101"/>
    </linearGradient>

    <!-- Top Highlight Line -->
    <linearGradient id="topLineGold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fdd506" stop-opacity="0.05"/>
      <stop offset="50%" stop-color="#fdd506" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#c3fc2f" stop-opacity="0.05"/>
    </linearGradient>

    <linearGradient id="tileBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f0f0f"/>
      <stop offset="100%" stop-color="#040404"/>
    </linearGradient>
  </defs>

  <style>
    .font-sans { font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'SF Pro Display', 'Segoe UI', Roboto, sans-serif; }
    .font-mono { font-family: 'JetBrains Mono', 'SFMono-Regular', Menlo, Monaco, Consolas, monospace; }

    @keyframes liveBeacon {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.35; transform: scale(0.9); }
    }

    .pulse-dot {
      animation: liveBeacon 2s ease-in-out infinite;
      transform-origin: center;
    }
  </style>

  <!-- Base Card Frame -->
  <rect width="495" height="195" rx="4" fill="url(#cardBg)" stroke="#1b1b1b" stroke-width="1"/>
  <line x1="12" y1="1" x2="483" y2="1" stroke="url(#topLineGold)" stroke-width="1"/>

  <!-- Card Header Row -->
  <g transform="translate(24, 28)">
    <text x="0" y="0" font-size="11" font-weight="700" fill="#fdd506" class="font-mono" letter-spacing="0.1em">JOSEPH AWER'S STATS</text>
    
    <!-- Status indicator on right -->
    <g transform="translate(340, -10)">
      <circle cx="8" cy="8" r="3.5" fill="#c3fc2f" class="pulse-dot"/>
      <text x="18" y="11.5" font-size="9.5" font-weight="700" fill="#c3fc2f" class="font-mono">VERIFIED</text>
    </g>
  </g>

  <!-- 4-Tile Grid Layout (No A+ efficiency) -->
  <g transform="translate(24, 46)">
    <!-- Tile 1: Repositories (Top Left) -->
    <g transform="translate(0, 0)">
      <rect width="215" height="56" rx="2" fill="url(#tileBg)" stroke="#1b1b1b" stroke-width="1"/>
      <g transform="translate(14, 18)">
        <text x="0" y="0" font-size="9.5" font-weight="700" fill="#74716b" class="font-mono" letter-spacing="0.08em">PUBLIC REPOS</text>
        <text x="0" y="24" font-size="20" font-weight="900" fill="#f8f5ee" class="font-mono">37</text>
        <text x="40" y="22" font-size="10.5" font-weight="500" fill="#d0cec7" class="font-sans">Codebases</text>
      </g>
    </g>

    <!-- Tile 2: TypeScript Dominance (Top Right) -->
    <g transform="translate(232, 0)">
      <rect width="215" height="56" rx="2" fill="url(#tileBg)" stroke="#1b1b1b" stroke-width="1"/>
      <g transform="translate(14, 18)">
        <text x="0" y="0" font-size="9.5" font-weight="700" fill="#74716b" class="font-mono" letter-spacing="0.08em">TYPESCRIPT RATIO</text>
        <text x="0" y="24" font-size="20" font-weight="900" fill="#fdd506" class="font-mono">85.4%</text>
        <text x="65" y="22" font-size="10.5" font-weight="500" fill="#d0cec7" class="font-sans">Core Stack</text>
      </g>
    </g>

    <!-- Tile 3: Production Systems (Bottom Left) -->
    <g transform="translate(0, 66)">
      <rect width="215" height="56" rx="2" fill="url(#tileBg)" stroke="#1b1b1b" stroke-width="1"/>
      <g transform="translate(14, 18)">
        <text x="0" y="0" font-size="9.5" font-weight="700" fill="#74716b" class="font-mono" letter-spacing="0.08em">SYSTEMS SHIPPED</text>
        <text x="0" y="24" font-size="20" font-weight="900" fill="#f8f5ee" class="font-mono">28+</text>
        <text x="45" y="22" font-size="10.5" font-weight="500" fill="#d0cec7" class="font-sans">Production</text>
      </g>
    </g>

    <!-- Tile 4: Member Since (Bottom Right) -->
    <g transform="translate(232, 66)">
      <rect width="215" height="56" rx="2" fill="url(#tileBg)" stroke="#1b1b1b" stroke-width="1"/>
      <g transform="translate(14, 18)">
        <text x="0" y="0" font-size="9.5" font-weight="700" fill="#74716b" class="font-mono" letter-spacing="0.08em">ACTIVE SINCE</text>
        <text x="0" y="24" font-size="20" font-weight="900" fill="#c3fc2f" class="font-mono">2020</text>
        <text x="56" y="22" font-size="10.5" font-weight="500" fill="#d0cec7" class="font-sans">July (Global)</text>
      </g>
    </g>
  </g>

  <!-- Bottom Micro Footer -->
  <g transform="translate(24, 182)">
    <circle cx="4" cy="-3" r="2.5" fill="#fdd506"/>
    <text x="14" y="0" font-size="10" font-weight="600" fill="#74716b" class="font-mono">
      ECOSYSTEM: <tspan fill="#d0cec7">TypeScript • Mobile (Expo) • Next.js • Python</tspan>
    </text>
  </g>
</svg>