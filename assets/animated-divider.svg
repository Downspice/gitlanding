<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 8" width="100%" height="8">
  <defs>
    <linearGradient id="laserGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f5d4" stop-opacity="0"/>
      <stop offset="20%" stop-color="#00f5d4" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="80%" stop-color="#bf5af2" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#bf5af2" stop-opacity="0"/>
    </linearGradient>

    <filter id="laserGlow" x="-20%" y="-100%" width="140%" height="300%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <style>
    @keyframes pulseLaser {
      0% { transform: translateX(-400px); opacity: 0.3; }
      50% { opacity: 1; }
      100% { transform: translateX(900px); opacity: 0.3; }
    }

    .laser-beam {
      animation: pulseLaser 4s cubic-bezier(0.4, 0, 0.2, 1) infinite;
    }
  </style>

  <!-- Base subtle line -->
  <rect x="0" y="3" width="900" height="2" rx="1" fill="#1e293b" opacity="0.6"/>

  <!-- Moving Laser Beam -->
  <g class="laser-beam">
    <rect x="0" y="2" width="400" height="4" rx="2" fill="url(#laserGrad)" filter="url(#laserGlow)"/>
  </g>
</svg>