<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 76" width="900" height="76" role="img" aria-label="Contact"><title>Contact</title><style>
.slamL{animation:slamL .45s cubic-bezier(.2,1.4,.4,1)}
.slamR{animation:slamR .45s cubic-bezier(.2,1.4,.4,1)}
@keyframes slamL{from{transform:translateX(-1040px)}to{transform:none}}
@keyframes slamR{from{transform:translateX(1040px)}to{transform:none}}
.drop{animation:drop .5s cubic-bezier(.2,1.6,.4,1)}
@keyframes drop{from{transform:translateY(-280px);opacity:0}to{transform:none;opacity:1}}
.blink{animation:blink 1.05s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.type{transform-box:fill-box;transform-origin:0 50%;animation:type linear both}
@keyframes type{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.marquee{animation:marquee linear infinite}
@keyframes marquee{to{transform:translateX(var(--d))}}
.sweep{animation:sweep 6.5s ease-in-out infinite}
@keyframes sweep{0%,12%{opacity:0}18%,38%{opacity:1}46%,100%{opacity:0}}
@media (prefers-reduced-motion:reduce){
  *{animation:none!important}
}
</style><g class="slamL"><polygon points="18,58 860,42 856,52 14,66" fill="#FFE500"/></g><g transform="translate(34,40) rotate(-6)"><g class="drop" style="animation-delay:0.05s"><rect x="-16" y="-18" width="32" height="36" fill="#fff" stroke="#000" stroke-width="2"/><text y="10" font-size="30" fill="#000" font-family="'Arial Black','Helvetica Neue',Arial,sans-serif" font-weight="900" text-anchor="middle">C</text></g></g><g transform="translate(68,40) rotate(5)"><g class="drop" style="animation-delay:0.09s"><rect x="-16" y="-18" width="32" height="36" fill="#FFE500" stroke="#000" stroke-width="2"/><text y="10" font-size="30" fill="#000" font-family="'Arial Black','Helvetica Neue',Arial,sans-serif" font-weight="900" text-anchor="middle">O</text></g></g><g transform="translate(102,40) rotate(-3)"><g class="drop" style="animation-delay:0.13s"><rect x="-16" y="-18" width="32" height="36" fill="#000" stroke="#000" stroke-width="2"/><text y="10" font-size="30" fill="#fff" font-family="'Arial Black','Helvetica Neue',Arial,sans-serif" font-weight="900" text-anchor="middle">N</text></g></g><g transform="translate(136,40) rotate(7)"><g class="drop" style="animation-delay:0.17s"><rect x="-16" y="-18" width="32" height="36" fill="#fff" stroke="#000" stroke-width="2"/><text y="10" font-size="30" fill="#000" font-family="'Arial Black','Helvetica Neue',Arial,sans-serif" font-weight="900" text-anchor="middle">T</text></g></g><g transform="translate(170,40) rotate(-4)"><g class="drop" style="animation-delay:0.21s"><rect x="-16" y="-18" width="32" height="36" fill="#fff" stroke="#000" stroke-width="2"/><text y="10" font-size="30" fill="#000" font-family="'Arial Black','Helvetica Neue',Arial,sans-serif" font-weight="900" text-anchor="middle">A</text></g></g><g transform="translate(204,40) rotate(3)"><g class="drop" style="animation-delay:0.25s"><rect x="-16" y="-18" width="32" height="36" fill="#FFE500" stroke="#000" stroke-width="2"/><text y="10" font-size="30" fill="#000" font-family="'Arial Black','Helvetica Neue',Arial,sans-serif" font-weight="900" text-anchor="middle">C</text></g></g><g transform="translate(238,40) rotate(-6)"><g class="drop" style="animation-delay:0.29s"><rect x="-16" y="-18" width="32" height="36" fill="#000" stroke="#000" stroke-width="2"/><text y="10" font-size="30" fill="#fff" font-family="'Arial Black','Helvetica Neue',Arial,sans-serif" font-weight="900" text-anchor="middle">T</text></g></g></svg>
